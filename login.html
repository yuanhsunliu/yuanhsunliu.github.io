<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAuthn 生物辨識登入</title>
</head>
<body>
<h1>WebAuthn 生物辨識測試</h1>

<label>用戶名：</label>
<input type="text" id="username" placeholder="輸入你的帳號"><br><br>

<button onclick="registerWebAuthn()">註冊 WebAuthn</button>
<button onclick="loginWithWebAuthn()">使用生物辨識登入</button>

<p id="status"></p>

<script>
    async function registerWebAuthn() {
        const username = document.getElementById("username").value;
        if (!username) {
            alert("請輸入用戶名！");
            return;
        }

        try {
            const publicKey = {
                challenge: Uint8Array.from("randomChallenge", c => c.charCodeAt(0)),
                rp: { name: "localhost" },
                user: {
                    id: Uint8Array.from(username, c => c.charCodeAt(0)),
                    name: username,
                    displayName: username
                },
                pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                authenticatorSelection: { authenticatorAttachment: "platform" },
                timeout: 60000,
                attestation: "none"
            };

            const credential = await navigator.credentials.create({ publicKey });
            localStorage.setItem("webauthnCredential", JSON.stringify(credential));
            document.getElementById("status").innerText = "✅ 註冊成功！";
        } catch (error) {
            console.error("註冊失敗:", error);
            document.getElementById("status").innerText = "❌ 註冊失敗：" + error;
        }
    }

    async function loginWithWebAuthn() {
        try {
            const storedCredential = localStorage.getItem("webauthnCredential");
            if (!storedCredential) {
                alert("請先註冊 WebAuthn！");
                return;
            }

            const publicKey = {
                challenge: Uint8Array.from("randomChallenge", c => c.charCodeAt(0)),
                allowCredentials: [{
                    id: JSON.parse(storedCredential).rawId,
                    type: "public-key",
                    transports: ["internal"]
                }],
                timeout: 60000
            };

            const assertion = await navigator.credentials.get({ publicKey });
            document.getElementById("status").innerText = "✅ 登入成功！";
        } catch (error) {
            console.error("登入失敗:", error);
            document.getElementById("status").innerText = "❌ 登入失敗：" + error;
        }
    }
</script>
</body>
</html>
